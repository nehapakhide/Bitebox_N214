<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
</head>
<body>
    <style>
        .colors{
            position:relative;
            height: 720px;
            width: 600px;
            padding: 15px;
        }
        .box{
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        .box1{
            height: 130px;
            width: 570px;
            top: 15px;
            left: 15px;
            background-color: skyblue; 
        }
        .box2{
            height: 215px;
            width: 440px;
            background-color: lightpink;
             top: 175px;
             left:15px;
        }
        .box3{
            top:175px;
            right:15px;
            background-color: rgb(108, 37, 127);
            height:215px;
            width: 120px;
        }
        .box4{
            top: 415px;
            left: 15px;
            background-color: rgb(97, 186, 8);
            height: 160px;
            width: 570px;
        }
        .box5{
           top: 575px;
           left: 15px;
           background-color: rgb(125, 15, 107);
           height: 140px;
           width: 570px; 
        }


    </style>
    <div class="colors">
        <div class=" box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class=" box box4">4</div>
        <div class=" box box5">5</div>
    </div>
</body>
</html>
