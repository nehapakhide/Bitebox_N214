<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .colors{
           margin: 30px auto;
            width: 600px;
            padding: 20px;
            background-color:lightskyblue;
        }
        
        .header{
            height: 80px;
            background-color:rgb(14, 128, 114);
            color:white;
            display:flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 30px;
        }
        .main{
            display:flex;
            gap: 25px;
        }
        .aside{
           width:30%;
           height:480px;
            background-color:rgb(21, 140, 31);
            color:white;
            display:flex;
            align-items: center;
            justify-content:center;
            font-size:28px;
            margin-bottom: 25px;        
        }
        .article{
            height: 480px;
            width: 70%;
            background-color:orange;
            color:white;
            padding: 20px;
            display:flex;
            justify-content:flex-end;
            font-size: 28px;
            flex-direction:column;

        }
        .article-title{
            color:white;
            font-size:25px;
            text-align:center;
            margin-bottom:25px;
        }
        .images{
            display:flex;
            gap: 12px;
        }
        .image div{
            flex:1;
            height: 150px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color:rgb(235, 239, 28);
           font-size:20px;
        }
        .footer{
            height: 80px;
            background-color:rgb(14, 128, 114);
            color:white;
            display:flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-top: 30px;
        }

    </style>
    <div class="colors">
        
        <div class="box header">Header</div>
        <div class="main">
        <div class="box aside">Aside</div>
        <div class="box article"></div>     
        <div class="article-title"></article></div>
        <div class="images">
            <div>Images</div>
            <div>Images</div>
            <div>Images</div>
        </div>
    </article>
       </div>
        <div class="box footer">Footer</div>
     
    </div>
</body>
</html>
